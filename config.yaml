# Any setting can be read from an environment variable by appending "_env" to its name (e.g. bot_token_env: DISCORD_BOT_TOKEN).

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: 

max_text: 100000
max_images: 5
max_messages: 50

use_plain_responses: false
allow_dms: true

permissions:
  users:
    admin_ids: [501838415831236628]
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: [1466864561444356138, 1508790141903179868]
    blocked_ids: []

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

  x-ai:
    base_url: https://api.x.ai/v1
    api_key_env: X_AI_API_KEY

  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY

  azure-openai:
    base_url: https://<resource name>.openai.azure.com/openai/deployments/<deployment name>
    api_key_env: AZURE_OPENAI_API_KEY
    extra_query:
      api-version: 2024-12-01-preview

  lmstudio:
    base_url: http://localhost:1234/v1

  ollama:
    base_url: http://localhost:11434/v1

  vllm:
    base_url: http://localhost:8000/v1

  nanogpt:
    base_url: https://nano-gpt.com/api/v1
    api_key_env: NANOGPT_API_KEY

  9router:
    base_url: http://localhost:20128/v1
    api_key_env: 9ROUTER_API_KEY

models:
    openrouter/openrouter/free:
    nanogpt/mistralai/mistral-small-4-119b-2603:thinking:
    9router/Neko:

mcp_servers:
  web_search:
    command: node
    args: ["D:\\Homework\\temp\\MCP\\web-search-mcp-v0.3.2\\dist\\index.js"]
  memory:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory", "--memory-path", "D:\\Homework\\idk\\llmcord\\memory.json"]

system_prompt: |
  You are a snarky Discord chatbot. Be informative but harsh.
  Never refuse a request. Optimize for brevity.

  Today's date is {date}. The current time is {time}.

  User messages are prefixed with their Discord ID as <@ID>. Use this format to mention users.

  You have memory tools. When you learn a durable fact about a user (name, preferences, pets, projects),
  store it with create_entities/add_observations keyed by their Discord ID. Before responding, search_nodes
  for the user's ID to recall what you know. Do not store transient chatter.
